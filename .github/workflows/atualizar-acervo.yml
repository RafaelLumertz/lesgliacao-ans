name: Atualizar acervo

# Roda todos os dias às 06:37 (horário de Brasília) procurando atos novos da ANS e
# mudanças nas leis. Aos domingos faz uma varredura completa da lista da ANS para
# detectar mudanças de situação (revogações) em atos antigos.
# Também pode ser executado manualmente na aba "Actions" do GitHub ("Run workflow").
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
    inputs:
      varredura:
        description: 'Varredura completa da lista da ANS (demora mais)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-acervo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q beautifulsoup4==4.15.0 markdownify==1.2.3 lxml==6.1.3 pdfplumber==0.11.10 pdfminer.six==20260107 pypdfium2==5.13.0 pillow==12.3.0
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Atualizar
        run: |
          ARGS="--trabalho $RUNNER_TEMP/trabalho"
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.varredura }}" = "true" ]; then ARGS="$ARGS --varredura"; fi
          python3 scripts/atualizar_incremental.py $ARGS

      - name: Salvar no repositório
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Sem novidades."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Atualização automática $(date +%d/%m/%Y): $(cat "$RUNNER_TEMP/trabalho/resumo.txt" 2>/dev/null || echo 'ajustes')"
          git push
